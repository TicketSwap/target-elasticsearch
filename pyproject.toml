[project]
name = "target-elasticsearch"
version = "1.0.2"
description = "`target-elasticsearch` is a singer target using the meltano SDK for targets"
authors = [{ name = "DT Mirizzi", email = "dtmirizzi@gmail.com" }]
requires-python = "<3.13,>=3.11"
license = "GPL-3.0"
keywords = [
    "elasticsearch",
    "ELT",
    "target",
    "meltano",
    "singer",
]
dependencies = [
    "requests>=2.34.2",
    "singer-sdk>=0.54.9",
    "elasticsearch>=8.19.3,<9",
    "Jinja2>=3.1.6",
    "jsonpath-ng>=1.12.0",
    "python-dateutil>=3.0.0",
    "types-python-dateutil>=2.9.0.20261021",
    "time-machine>=3.5.1",
    "typing-extensions>=4.16.0",
]

[project.scripts]
target-elasticsearch = "target_elasticsearch.target:TargetElasticsearch.cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "tox>=4.67.1,<5",
    "flake8>=7.4.1,<8",
    "black>=26.10.1,<27",
    "pydocstyle>=6.3.0,<7",
    "mypy>=2.4.0,<2.5",
    "isort>=9.0.2,<10",
    "pre-commit>=4.7.0,<5",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1,<2"]

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "target_elasticsearch"

[tool.black]
line-length = 120
target-version = ['py311']
